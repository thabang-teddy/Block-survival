name: block_survival
description: "Block Survival — native client for Android, Windows and Linux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  flutter_secure_storage: ^11.1.1
  flutter_webrtc: ^1.6.2+hotfix.3
  hooks: ^2.0.2
  http: ^1.6.0
  path_provider: ^2.1.6
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # built by hook/build.dart from shaders/ (see lib/render/)
    - build/shaderbundles/block.shaderbundle

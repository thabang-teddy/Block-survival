# CI for server/ (the Laravel app + web client): test every push and PR; on a
# push to master/staging, build a deployable tree (vendor/ + public/build/
# committed) and force-push it as a single orphan commit to deploy/production
# or deploy/staging. The cPanel account pulls that branch — see
# docs/cpanel-go-live.md §5. The artefact is server/ itself, so the deploy
# branches look exactly as they did when the app lived at the repo root.
#
# No path filter on purpose: the flow/test checks are required on PRs, and a
# filtered-out required check blocks the merge forever. client/ (the Flutter
# app) is not built in CI; a client-only PR still runs this one (about a minute).
# pc-host/ (the global world's home-PC host) is tested in its own job; it is
# never deployed from here — it is packaged by hand (pc-host/README.md).
#
# Promotion order is dev -> staging -> master (§5.0). The `flow` job fails any
# PR that skips a stage; branch protection on GitHub blocks direct pushes.
name: CI

on:
  push:
    branches: [dev, staging, master]
  pull_request:
    branches: [dev, staging, master]

permissions:
  contents: read

env:
  # must match the PHP Selector setting on the cPanel account (§4.2) and
  # MIN_PHP_ID in server/deploy/cpanel-deploy.sh
  CPANEL_PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  PHP_EXTENSIONS: mbstring, xml, ctype, fileinfo, tokenizer, pdo_sqlite, sqlite3, bcmath, intl, curl, openssl, zip

jobs:
  flow:
    name: Promotion order (dev -> staging -> master)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR comes from the previous stage
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            master)  want=staging ;;
            staging) want=dev ;;
            *)       echo "PR into $BASE from $HEAD: no ordering rule"; exit 0 ;;
          esac
          if [ "$HEAD" != "$want" ]; then
            echo "::error::PRs into $BASE must come from $want, not $HEAD (docs/cpanel-go-live.md §5.0)"
            exit 1
          fi
          echo "$HEAD -> $BASE: ok"

  test:
    name: Test (PHPUnit + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ env.CPANEL_PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.CPANEL_PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: PHPUnit
        run: php artisan test

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        # laravel-vite-plugin aborts when CI=true and Vite is in serve mode,
        # which is how Vitest loads vite.config.ts; this is its documented bypass
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: npm test

  pc-host:
    # the app that hosts the global world on a home PC (docs/pc-host-research.md);
    # it imports the game code from server/resources/js, so server/ is installed too.
    # Its tests open real WebRTC DataChannels over loopback (node-datachannel).
    name: Test pc-host (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            pc-host/package-lock.json

      - name: Install the shared game code's dependencies
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Install pc-host dependencies
        # not --ignore-scripts: node-datachannel fetches its prebuilt binary on install
        working-directory: pc-host
        run: npm ci

      - name: Type check
        working-directory: pc-host
        run: npm run typecheck

      - name: Vitest
        working-directory: pc-host
        run: npm test

      - name: Build
        working-directory: pc-host
        run: npm run build

  build:
    name: Build artefact (deploy/production from master, deploy/staging from staging)
    needs: test
    # only real pushes to the two source branches produce an artefact; a PR
    # must never deploy its own head
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ env.CPANEL_PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.CPANEL_PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('server/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader --classmap-authoritative

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build front-end bundle
        run: npm run build

      - name: Assemble deployable tree
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/artefact"
          mkdir -p "$ART"
          # everything the server needs, nothing it does not (cwd is server/)
          rsync -a \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='.phpunit.result.cache' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/testing/' \
            --exclude='database/*.sqlite' \
            --exclude='database/*.sqlite-*' \
            --exclude='public/hot' \
            ./ "$ART/"

          # the artefact tree tracks vendor/ and public/build/; only runtime
          # state stays untracked so `git reset --hard` on the server never
          # touches it
          # anchored: deploy/.env.cpanel.example must ship with the artefact
          cat > "$ART/.gitignore" <<'EOF'
          /.env
          /.env.*
          .deploy.lock
          /storage/logs/*
          /storage/framework/cache/*
          /storage/framework/sessions/*
          /storage/framework/views/*
          /storage/framework/down
          /bootstrap/cache/*.php
          /database/*.sqlite
          /database/*.sqlite-*
          EOF

          cat > "$ART/BUILD_INFO" <<EOF
          env=$DEPLOY_ENV
          source_branch=$GITHUB_REF_NAME
          source_sha=$GITHUB_SHA
          run=$GITHUB_RUN_NUMBER
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          php=$CPANEL_PHP_VERSION
          EOF

          du -sh "$ART" "$ART/vendor" "$ART/public/build"

      - name: Publish deploy/${{ env.DEPLOY_ENV }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/artefact"
          git init -q -b "deploy/$DEPLOY_ENV"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build($DEPLOY_ENV): ${GITHUB_SHA::7} from $GITHUB_REF_NAME (run #$GITHUB_RUN_NUMBER)"
          # one orphan commit per build: the artefact branch carries no history
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/deploy/$DEPLOY_ENV"
          echo "deploy/$DEPLOY_ENV = $(git rev-parse --short HEAD)  (source ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
